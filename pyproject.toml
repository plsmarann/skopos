[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skopos"
version = "0.3.0"
description = "CLI scout/guardian for detecting AI agents and model runtimes on local devices"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Skopos Maintainers", email = "plsmaran@gmail.com" }]
license = { text = "MIT" }
keywords = ["security", "agent", "ai", "monitoring", "cli", "guardian"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.5",
]
yaml = ["pyyaml>=6.0"]
web = [
  "flask>=2.3.0",
  "flask-cors>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/plsmarann/skopos"
Repository = "https://github.com/plsmarann/skopos"
Issues = "https://github.com/plsmarann/skopos/issues"

[project.scripts]
skopos = "skopos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
